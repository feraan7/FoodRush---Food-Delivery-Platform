<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="plate" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="#475569"/>
      <stop offset="90%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </radialGradient>
    <radialGradient id="appamGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fdfbf7"/>
      <stop offset="85%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="stew" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="60%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#0f172a"/>
  
  <!-- Serving Plate -->
  <ellipse cx="170" cy="155" rx="140" ry="115" fill="url(#plate)" stroke="#64748b" stroke-width="4"/>

  <!-- Lacy Appam with soft pillowy hopper center -->
  <!-- Outer lace / appam edge -->
  <circle cx="160" cy="150" r="95" fill="url(#appamGrad)" opacity="0.95"/>
  <!-- Crispy lace texture notches -->
  <circle cx="160" cy="150" r="96" fill="none" stroke="#d97706" stroke-width="3" stroke-dasharray="3 6 8 4" opacity="0.8"/>
  <!-- Soft fluffy sponged center (appam mound) -->
  <ellipse cx="160" cy="150" rx="48" ry="42" fill="#ffffff" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.15))"/>
  <!-- Yeast fermentation pores in appam -->
  <circle cx="150" cy="142" r="3" fill="#e2e8f0"/>
  <circle cx="168" cy="145" r="2.5" fill="#cbd5e1"/>
  <circle cx="158" cy="158" r="3" fill="#e2e8f0"/>
  <circle cx="174" cy="156" r="2" fill="#cbd5e1"/>
  <circle cx="145" cy="155" r="2" fill="#cbd5e1"/>

  <!-- Coconut Milk Stew Bowl (Ishtu) -->
  <ellipse cx="300" cy="180" rx="75" ry="60" fill="#e2e8f0" stroke="#94a3b8" stroke-width="4"/>
  <ellipse cx="300" cy="178" rx="66" ry="50" fill="url(#stew)"/>
  <!-- Vegetables / Chicken in Stew (carrots, potatoes, green peas, curry leaves, whole peppercorns) -->
  <!-- Carrots -->
  <rect x="270" y="160" width="14" height="9" rx="3" fill="#ea580c"/>
  <rect x="310" y="175" width="13" height="8" rx="3" fill="#ea580c"/>
  <!-- Potatoes -->
  <circle cx="295" cy="170" r="8" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="330" cy="165" r="7" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <!-- Green peas -->
  <circle cx="280" cy="185" r="4.5" fill="#16a34a"/>
  <circle cx="318" cy="190" r="4" fill="#16a34a"/>
  <circle cx="298" cy="195" r="4.5" fill="#15803d"/>
  <!-- Black peppercorns -->
  <circle cx="265" cy="175" r="2" fill="#1e293b"/>
  <circle cx="325" cy="180" r="2" fill="#1e293b"/>
  <!-- Cinnamon stick slice -->
  <line x1="285" y1="150" x2="305" y2="155" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
  <!-- Curry leave float -->
  <ellipse cx="285" cy="170" rx="8" ry="4" fill="#15803d" transform="rotate(35 285 170)"/>

  <text x="200" y="280" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle">Lacy Appam &amp; Nadan Stew</text>
</svg>