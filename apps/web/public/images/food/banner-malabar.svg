<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="malabarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>
  <rect width="600" height="240" fill="url(#malabarGrad)"/>
  
  <!-- Decorative spice motifs -->
  <circle cx="50" cy="50" r="80" fill="#f59e0b" opacity="0.08"/>
  <circle cx="550" cy="190" r="120" fill="#f97316" opacity="0.08"/>

  <!-- Uruli / Biryani Pot silhouette right -->
  <g transform="translate(420, 40) scale(0.6)">
    <ellipse cx="150" cy="150" rx="120" ry="80" fill="#d97706" opacity="0.85"/>
    <ellipse cx="150" cy="130" rx="100" ry="50" fill="#fef08a"/>
    <ellipse cx="150" cy="120" rx="20" ry="12" fill="#b45309"/>
    <!-- Steam -->
    <path d="M 130,90 Q 120,60 135,40" stroke="#fef08a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
    <path d="M 160,85 Q 170,55 155,35" stroke="#fef08a" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="50" y="80" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#fcd34d" text-transform="uppercase">AUTHENTIC KERALA CUISINE</text>
  <text x="50" y="130" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff">Malabar Spice Kitchen</text>
  <text x="50" y="165" font-family="system-ui, sans-serif" font-size="16" fill="#fed7aa">Dum Biryanis, Porottas &amp; Traditional Kozhikode Delicacies</text>
  
  <!-- Rating pill -->
  <rect x="50" y="185" width="145" height="30" rx="15" fill="#15803d"/>
  <text x="122" y="205" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">★ 4.8 (1,200+ Reviews)</text>
</svg>