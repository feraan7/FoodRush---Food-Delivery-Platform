<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="uruli" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="95%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </radialGradient>
    <radialGradient id="payasam" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="40%" stop-color="#ffe4e6"/>
      <stop offset="80%" stop-color="#fecdd3"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </radialGradient>
  </defs>
  <rect width="400" height="300" fill="#0f172a"/>

  <!-- Traditional Bronze Uruli (Vaarpu) -->
  <!-- Uruli side handles -->
  <circle cx="45" cy="150" r="18" fill="none" stroke="#b45309" stroke-width="6"/>
  <circle cx="355" cy="150" r="18" fill="none" stroke="#b45309" stroke-width="6"/>

  <ellipse cx="200" cy="150" rx="160" ry="110" fill="url(#uruli)" stroke="#78350f" stroke-width="4"/>
  <ellipse cx="200" cy="146" rx="145" ry="96" fill="#b45309"/>

  <!-- Rich Creamy Pink Slow-Cooked Palada Payasam -->
  <ellipse cx="200" cy="144" rx="138" ry="90" fill="url(#payasam)"/>

  <!-- Steamed Rice Flakes (Ada ribbons) floating in milk -->
  <path d="M 120,135 Q 140,125 155,140 Q 140,150 120,135 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 170,160 Q 195,150 210,168 Q 185,178 170,160 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 230,125 Q 255,115 270,135 Q 248,142 230,125 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M 160,115 Q 185,108 198,122 Q 175,130 160,115 Z" fill="#ffffff" opacity="0.85"/>
  <path d="M 220,155 Q 240,145 255,160 Q 235,170 220,155 Z" fill="#ffffff" opacity="0.85"/>

  <!-- Ghee-roasted golden cashews (Kaju) -->
  <path d="M 150,135 Q 165,128 170,142 Q 162,150 150,135 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <path d="M 240,145 Q 255,138 260,152 Q 252,160 240,145 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <path d="M 195,130 Q 210,122 215,136 Q 207,144 195,130 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Plump Ghee-fried golden raisins (Kismis) -->
  <ellipse cx="185" cy="145" rx="6" ry="4.5" fill="#854d0e" stroke="#581c87" stroke-width="1"/>
  <ellipse cx="225" cy="138" rx="6.5" ry="5" fill="#854d0e" stroke="#581c87" stroke-width="1"/>
  <ellipse cx="170" cy="155" rx="5.5" ry="4" fill="#854d0e"/>

  <!-- Cardamom powder specks (Elakka) -->
  <circle cx="160" cy="140" r="1.5" fill="#3f6212"/>
  <circle cx="210" cy="155" r="1.5" fill="#3f6212"/>
  <circle cx="230" cy="128" r="1.5" fill="#3f6212"/>
  <circle cx="190" cy="165" r="1.5" fill="#3f6212"/>

  <!-- Golden pure ghee sheen layer on top -->
  <ellipse cx="200" cy="135" rx="60" ry="25" fill="#fef08a" opacity="0.25"/>

  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle">Nadan Palada Payasam</text>
</svg>