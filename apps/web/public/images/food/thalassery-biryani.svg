  <ellipse cx="142" cy="165" rx="8" ry="6" fill="#F59E0B"/>
  <!-- Fresh Mint & Coriander sprig -->
  <path d="M 205 105 Q 215 90 225 95 Q 220 108 205 105 Z" fill="#16A34A"/>
  <path d="M 202 103 Q 195 90 188 95 Q 192 108 202 103 Z" fill="#22C55E"/>
