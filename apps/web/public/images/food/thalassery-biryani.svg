  <circle cx="220" cy="130" r="3" fill="#FEF08A"/>
  <circle cx="245" cy="145" r="3.5" fill="#FEF08A"/>
  <circle cx="140" cy="150" r="4" fill="#FCD34D"/>
  <circle cx="175" cy="155" r="3" fill="#FEF08A"/>
