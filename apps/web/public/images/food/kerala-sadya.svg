<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="50%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  <ellipse cx="200" cy="250" rx="160" ry="20" fill="#000" opacity="0.06"/>
  <!-- Banana Leaf (Vazhayila) -->
  <path d="M 40 160 C 40 70, 360 70, 360 160 C 360 225, 40 225, 40 160 Z" fill="url(#leaf)"/>
  <line x1="40" y1="160" x2="360" y2="160" stroke="#14532D" stroke-width="2" stroke-dasharray="8 4"/>
  <!-- Kerala Red Matta Rice Mound -->
  <ellipse cx="200" cy="175" rx="55" ry="32" fill="#E2E8F0"/>
  <ellipse cx="200" cy="170" rx="50" ry="26" fill="#F87171" opacity="0.45"/>
  <!-- Yellow Parippu & Ghee on top -->
  <ellipse cx="200" cy="165" rx="22" ry="12" fill="#FBBF24"/>
  <circle cx="200" cy="164" r="6" fill="#F59E0B"/>
  <!-- Traditional Curries on Leaf border -->
  <!-- Avial -->
  <ellipse cx="100" cy="130" rx="18" ry="12" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
  <line x1="94" y1="128" x2="106" y2="132" stroke="#16A34A" stroke-width="2"/>
  <!-- Thoran (beans/cabbage with coconut) -->
  <ellipse cx="145" cy="115" rx="16" ry="10" fill="#BBF7D0" stroke="#16A34A" stroke-width="1.5"/>
  <circle cx="142" cy="113" r="1.5" fill="#FFFFFF"/>
  <circle cx="147" cy="116" r="1.5" fill="#FFFFFF"/>
  <!-- Olan -->
  <ellipse cx="195" cy="110" rx="16" ry="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Kalan / Moru curry -->
  <ellipse cx="245" cy="115" rx="17" ry="11" fill="#FDE047" stroke="#EAB308" stroke-width="1.5"/>
  <!-- Injipuli / Ginger tamarind chutney -->
  <ellipse cx="290" cy="130" rx="14" ry="9" fill="#7C2D12"/>
  <!-- Mango Pickle -->
  <ellipse cx="320" cy="148" rx="12" ry="8" fill="#DC2626"/>
  <!-- Crispy Pappadam -->
  <circle cx="115" cy="190" r="24" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <circle cx="115" cy="190" r="18" fill="#FDE68A" opacity="0.5"/>
  <!-- Banana Chips (Upperi & Sharkara Varatti) -->
  <circle cx="75" cy="160" r="8" fill="#FBBF24" stroke="#D97706" stroke-width="1.5"/>
  <circle cx="70" cy="175" r="7" fill="#78350F"/>
  <!-- Payasam in small earthen cup -->
  <ellipse cx="295" cy="180" rx="18" ry="12" fill="#FED7AA" stroke="#EA580C" stroke-width="2"/>
  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#14532D" text-anchor="middle">Grand Kerala Onasadya Plate</text>
</svg>
