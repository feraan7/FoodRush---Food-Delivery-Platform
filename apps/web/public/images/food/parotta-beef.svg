<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="parottaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="45%" stop-color="#fef3c7"/>
      <stop offset="80%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
    <linearGradient id="beefRoast" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#291206"/>
      <stop offset="50%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="#09090b"/>

  <!-- Traditional Serving Tray / Plate -->
  <ellipse cx="200" cy="155" rx="180" ry="120" fill="#27272a" stroke="#52525b" stroke-width="3"/>
  
  <!-- Spiral Layered Flaky Malabar Parotta #1 -->
  <ellipse cx="130" cy="145" rx="80" ry="65" fill="url(#parottaGrad)"/>
  <!-- Concentric spiral rings indicating layered flakiness -->
  <ellipse cx="130" cy="145" rx="65" ry="52" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 5"/>
  <ellipse cx="130" cy="145" rx="45" ry="36" fill="none" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 4"/>
  <ellipse cx="130" cy="145" rx="25" ry="20" fill="none" stroke="#92400e" stroke-width="2"/>
  <!-- Golden blister charred spots on hot tawa -->
  <ellipse cx="105" cy="130" rx="9" ry="5" fill="#78350f" opacity="0.8"/>
  <ellipse cx="150" cy="160" rx="12" ry="6" fill="#78350f" opacity="0.8"/>
  <ellipse cx="140" cy="120" rx="8" ry="4" fill="#92400e" opacity="0.75"/>

  <!-- Slow-roasted Spicy Kerala Beef Fry / Roast with coconut slivers -->
  <ellipse cx="270" cy="155" rx="85" ry="68" fill="#1c1917" stroke="#78350f" stroke-width="3"/>
  <ellipse cx="270" cy="153" rx="78" ry="60" fill="url(#beefRoast)"/>

  <!-- Roasted meat chunks with deep blackish-brown caramelization -->
  <rect x="230" y="130" width="28" height="22" rx="6" fill="#170d07" stroke="#451a03" stroke-width="2"/>
  <rect x="265" y="115" width="32" height="26" rx="7" fill="#201109" stroke="#451a03" stroke-width="2"/>
  <rect x="280" y="145" width="30" height="24" rx="6" fill="#170d07" stroke="#451a03" stroke-width="2"/>
  <rect x="240" y="160" width="28" height="22" rx="5" fill="#201109" stroke="#451a03" stroke-width="2"/>
  <rect x="220" y="145" width="22" height="18" rx="4" fill="#170d07"/>

  <!-- Thenga Kothu (Golden crisp fried coconut bites) -->
  <rect x="245" y="125" width="14" height="4" rx="1.5" fill="#f59e0b" transform="rotate(25 245 125)"/>
  <rect x="290" y="135" width="16" height="4.5" rx="1.5" fill="#d97706" transform="rotate(-30 290 135)"/>
  <rect x="270" y="165" width="15" height="4" rx="1.5" fill="#f59e0b" transform="rotate(15 270 165)"/>
  <rect x="235" y="150" width="13" height="4" rx="1.5" fill="#d97706" transform="rotate(-40 235 150)"/>

  <!-- Fresh fried curry leaves & slit green chilies -->
  <ellipse cx="275" cy="138" rx="11" ry="5" fill="#15803d" transform="rotate(45 275 138)"/>
  <ellipse cx="255" cy="170" rx="9" ry="4" fill="#166534" transform="rotate(-20 255 170)"/>
  <!-- Slit chili -->
  <path d="M 290,165 Q 315,160 320,180" stroke="#22c55e" stroke-width="3" fill="none"/>
  <!-- Red onion rings -->
  <circle cx="185" cy="205" r="16" fill="none" stroke="#f472b6" stroke-width="3.5"/>
  <circle cx="210" cy="215" r="14" fill="none" stroke="#fbcfe8" stroke-width="3"/>

  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle">Malabar Parotta &amp; Beef Roast</text>
</svg>