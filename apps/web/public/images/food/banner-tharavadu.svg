<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <linearGradient id="tharavaduGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="50%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <rect width="600" height="240" fill="url(#tharavaduGrad)"/>
  
  <!-- Traditional temple / tharavadu roof silhouette -->
  <g transform="translate(420, 30) scale(0.65)" fill="#fef08a" opacity="0.25">
    <polygon points="120,20 30,120 210,120"/>
    <rect x="50" y="120" width="140" height="80"/>
  </g>

  <!-- Typography -->
  <text x="50" y="80" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#86efac" text-transform="uppercase">GRAND VEGETARIAN HERITAGE</text>
  <text x="50" y="130" font-family="system-ui, sans-serif" font-size="34" font-weight="900" fill="#ffffff">Tharavadu Heritage Sadya</text>
  <text x="50" y="165" font-family="system-ui, sans-serif" font-size="16" fill="#dcfce7">Authentic 24-dish Banana Leaf Feast, Palada Payasam &amp; Stews</text>
  
  <!-- Rating pill -->
  <rect x="50" y="185" width="145" height="30" rx="15" fill="#15803d" stroke="#86efac" stroke-width="1"/>
  <text x="122" y="205" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">★ 4.9 (2,100+ Reviews)</text>
</svg>