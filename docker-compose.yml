version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: foodrush-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: foodrush-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/foodrush}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CLIENT_ORIGINS: ${CLIENT_ORIGINS:-http://localhost:80,http://localhost:5173}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
      MOCK_PAYMENT_SECRET: ${MOCK_PAYMENT_SECRET}
    depends_on:
      - mongo

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: foodrush-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  mongo-data:
